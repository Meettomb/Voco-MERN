<!-- labels -->
<g class="label"><text x="350" y="225">profilePicId</text><text x="350" y="585">userId</text><text x="630" y="765">embedded</text><text x="350" y="905">userId (ref)</text><text x="660" y="1080">embedded</text><text x="870" y="185">learningLanguages</text><text x="840" y="395">languageId / chapters</text><text x="830" y="675">language + chapter</text><text x="855" y="488">chapterId</text><text x="840" y="840">difficulties</text><text x="1350" y="190">chapterIds</text><text x="1335" y="440">chapterIds</text><text x="1345" y="575">mcqIds</text><text x="1648" y="345">questions</text></g>
<!-- classes -->
<g>
<rect x="40" y="120" width="300" height="370" class="card blue"/><text x="58" y="153" class="head">User</text><path d="M40 166H340" stroke="#4a78a8"/>
<text x="58" y="194" class="body"><tspan x="58" dy="0">+ id: ObjectId</tspan><tspan x="58" dy="24">+ username, email, phoneNumber: String</tspan><tspan x="58" dy="24">+ password: String</tspan><tspan x="58" dy="24">+ uiSupportLangauge: String</tspan><tspan x="58" dy="24">+ learningLanguages: ObjectId[]</tspan><tspan x="58" dy="24">+ role: user | admin</tspan><tspan x="58" dy="24">+ isActive: Boolean</tspan><tspan x="58" dy="24">+ phoneNumberVerified: Boolean</tspan><tspan x="58" dy="24">+ emailNotifications: Boolean</tspan><tspan x="58" dy="24">+ reminderTime: String</tspan><tspan x="58" dy="24">+ profilePicId: ObjectId</tspan></text>
<rect x="40" y="550" width="300" height="140" class="card blue"/><text x="58" y="584" class="head">ProfilePic</text><path d="M40 596H340" stroke="#4a78a8"/><text x="58" y="624" class="body"><tspan x="58">+ id: ObjectId</tspan><tspan x="58" dy="24">+ imageUrl: String</tspan><tspan x="58" dy="24">+ timestamps</tspan></text>
<rect x="40" y="780" width="300" height="140" class="card blue"/><text x="58" y="814" class="head">UserProgress</text><path d="M40 826H340" stroke="#4a78a8"/><text x="58" y="855" class="body"><tspan x="58">+ id: ObjectId</tspan><tspan x="58" dy="24">+ userId: ObjectId</tspan><tspan x="58" dy="24">+ timestamps</tspan></text>
<rect x="40" y="970" width="300" height="160" class="card purple"/><text x="58" y="1004" class="head">LanguageProgress Â· embedded</text><path d="M40 1016H340" stroke="#8064a2"/><text x="58" y="1044" class="body"><tspan x="58">+ languageId: ObjectId</tspan><tspan x="58" dy="24">+ completedChapters: ObjectId[]</tspan><tspan x="58" dy="24">+ isCourseCompleted: Boolean</tspan><tspan x="58" dy="24">+ completedAt: Date</tspan></text>
<rect x="470" y="120" width="350" height="240" class="card blue"/><text x="488" y="154" class="head">Conversation</text><path d="M470 166H820" stroke="#4a78a8"/><text x="488" y="194" class="body"><tspan x="488">+ id, userId: ObjectId</tspan><tspan x="488" dy="25">+ language: en | hi</tspan><tspan x="488" dy="25">+ status: active | analyzing | completed</tspan><tspan x="488" dy="25">+ startedAt, endedAt: Date</tspan><tspan x="488" dy="25">+ messages: ConversationMessage[]</tspan><tspan x="488" dy="25">+ performance: ConversationPerformance</tspan></text>
<rect x="470" y="410" width="350" height="150" class="card purple"/><text x="488" y="444" class="head">ConversationMessage Â· embedded</text><path d="M470 456H820" stroke="#8064a2"/><text x="488" y="484" class="body"><tspan x="488">+ role: user | assistant</tspan><tspan x="488" dy="25">+ content: String</tspan><tspan x="488" dy="25">+ timestamp: Date</tspan></text>
<rect x="470" y="610" width="350" height="180" class="card purple"/><text x="488" y="644" class="head">ConversationPerformance Â· embedded</text><path d="M470 656H820" stroke="#8064a2"/><text x="488" y="684" class="body"><tspan x="488">+ overall, grammar, vocabulary scores</tspan><tspan x="488" dy="24">+ fluency, quality scores</tspan><tspan x="488" dy="24">+ strengths, improvements, practiceWords[]</tspan><tspan x="488" dy="24">+ feedback: String</tspan></text>
<rect x="470" y="850" width="350" height="220" class="card blue"/><text x="488" y="884" class="head">ExamAttempt</text><path d="M470 896H820" stroke="#4a78a8"/><text x="488" y="924" class="body"><tspan x="488">+ userId, chapterId, langId: ObjectId</tspan><tspan x="488" dy="25">+ examType: chapter | final</tspan><tspan x="488" dy="25">+ mcqIds: ObjectId[]</tspan><tspan x="488" dy="25">+ answers: ExamAnswer[]</tspan><tspan x="488" dy="25">+ startTime, endTime: Date</tspan><tspan x="488" dy="25">+ isCompleted: Boolean</tspan></text>
<rect x="470" y="1100" width="350" height="140" class="card purple"/><text x="488" y="1134" class="head">ExamAnswer Â· embedded</text><path d="M470 1146H820" stroke="#8064a2"/><text x="488" y="1174" class="body"><tspan x="488">+ mcqId: ObjectId</tspan><tspan x="488" dy="24">+ questionIndex, selectedOption: Number</tspan></text>
<rect x="970" y="120" width="350" height="200" class="card green"/><text x="988" y="154" class="head">LearningLanguage</text><path d="M970 166H1320" stroke="#4e9464"/><text x="988" y="194" class="body"><tspan x="988">+ id: ObjectId</tspan><tspan x="988" dy="25">+ english, native, code: String</tspan><tspan x="988" dy="25">+ chapters: ObjectId[]</tspan><tspan x="988" dy="25">+ timestamps</tspan></text>
<rect x="970" y="390" width="350" height="160" class="card green"/><text x="988" y="424" class="head">Chapter</text><path d="M970 436H1320" stroke="#4e9464"/><text x="988" y="464" class="body"><tspan x="988">+ id, languageId: ObjectId</tspan><tspan x="988" dy="25">+ translations: Map</tspan><tspan x="988" dy="25">+ timestamps</tspan></text>
<rect x="970" y="630" width="350" height="200" class="card green"/><text x="988" y="664" class="head">LearningWords</text><path d="M970 676H1320" stroke="#4e9464"/><text x="988" y="704" class="body"><tspan x="988">+ id: ObjectId</tspan><tspan x="988" dy="25">+ language, chapter: ObjectId</tspan><tspan x="988" dy="25">+ contentType: String</tspan><tspan x="988" dy="25">+ grammarContent: Map</tspan><tspan x="988" dy="25">+ difficulties: DifficultySet[]</tspan></text>
<rect x="970" y="900" width="350" height="140" class="card purple"/><text x="988" y="934" class="head">DifficultySet Â· embedded</text><path d="M970 946H1320" stroke="#8064a2"/><text x="988" y="974" class="body"><tspan x="988">+ level: String</tspan><tspan x="988" dy="25">+ words: Map[]</tspan></text>
<rect x="1460" y="120" width="350" height="180" class="card green"/><text x="1478" y="154" class="head">MCQSet</text><path d="M1460 166H1810" stroke="#4e9464"/><text x="1478" y="194" class="body"><tspan x="1478">+ id: ObjectId</tspan><tspan x="1478" dy="25">+ chapterIds: ObjectId[]</tspan><tspan x="1478" dy="25">+ difficultyLevel: String</tspan><tspan x="1478" dy="25">+ questions: Question[]</tspan></text>
<rect x="1460" y="360" width="350" height="150" class="card purple"/><text x="1478" y="394" class="head">Question Â· embedded</text><path d="M1460 406H1810" stroke="#8064a2"/><text x="1478" y="434" class="body"><tspan x="1478">+ question: Map</tspan><tspan x="1478" dy="25">+ options: Map[]</tspan><tspan x="1478" dy="25">+ correctAnswer: Number</tspan></text>
<rect x="1460" y="570" width="350" height="180" class="card orange"/><text x="1478" y="604" class="head">UiLanguage</text><path d="M1460 616H1810" stroke="#c58a3a"/><text x="1478" y="644" class="body"><tspan x="1478">+ id: ObjectId</tspan><tspan x="1478" dy="25">+ code, englishName, nativeName</tspan><tspan x="1478" dy="25">+ isActive: Boolean</tspan><tspan x="1478" dy="25">+ timestamps</tspan></text>
<rect x="1460" y="850" width="390" height="180" rx="0" fill="#fff" stroke="#aab6c2" stroke-width="2"/><text x="1480" y="884" class="head">Legend / relationship details</text><text x="1480" y="916" class="small"><tspan x="1480">Blue: user activity Â· Green: learning content</tspan><tspan x="1480" dy="23">Purple: embedded subdocument Â· Orange: UI catalog</tspan><tspan x="1480" dy="23">Dashed: logical ObjectId without Mongoose ref</tspan><tspan x="1480" dy="23">ExamAttempt user/chapter/lang IDs are unref'd</tspan><tspan x="1480" dy="23">User UI language is stored as String</tspan></text>
</g></svg>
