<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400">
<defs><style>.title{font:700 32px Arial;fill:#000000}.sub{font:16px Arial;fill:#000000}.head{font:700 19px Arial;fill:#000000}.body{font:15px Arial;fill:#000000}.small{font:13px Arial;fill:#000000}.blue{fill:#ffffff;stroke:#000000}.green{fill:#ffffff;stroke:#000000}.purple{fill:#ffffff;stroke:#000000}.orange{fill:#ffffff;stroke:#000000}.card{stroke-width:2;rx:0}.line{fill:none;stroke:#000000;stroke-width:2}.dash{stroke-dasharray:8 7}.label{font:13px Arial;fill:#536779;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}</style></defs>
<rect width="1920" height="1400" fill="#f8fafc"/>
<text x="48" y="56" class="title">Voco â€” UML Class Diagram</text><text x="48" y="86" class="sub">Backend domain model Â· Mongoose schemas Â· ObjectId references and embedded records</text>
